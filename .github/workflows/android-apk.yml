name: Android APK

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'android/**'
      - 'index.html'
      - 'native-bridge.js'
      - 'concept-map.js'
      - 'appearance.js'
      - 'audio-import.js'
      - 'tools/**'
      - '.github/workflows/android-apk.yml'
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'index.html'
      - 'native-bridge.js'
      - 'concept-map.js'
      - 'appearance.js'
      - 'audio-import.js'
      - 'icon.svg'
      - '.github/workflows/android-apk.yml'

concurrency:
  group: android-apk-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK 35
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"'
      - name: Set increasing Android version code
        run: echo "VOICESCRIBE_VERSION_CODE=$((100000 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"
      - name: Test and build unsigned release candidate
        working-directory: android
        run: java -classpath gradle/wrapper/gradle-wrapper.jar org.gradle.wrapper.GradleWrapperMain --no-daemon :app:testDebugUnitTest :app:assembleDebug :app:assembleRelease
      - name: Verify web and native UI flows
        run: |
          node tools/check-app.js
          node tools/smoke-test.js
          node tools/native-bridge-test.js
          node tools/provider-test.js
          node tools/speakers-test.js
          node tools/transcript-turns-test.js
          node tools/professional-test.js
          node tools/analysis-test.js
          node tools/long-context-test.js
          node tools/rich-results-test.js
          node tools/concept-map-test.js
          node tools/audio-import-test.js
          node tools/long-recording-test.js
      - name: Verify responsive layout and capture previews
        env:
          CHROME_BIN: /usr/bin/google-chrome
          PREVIEW_OUTPUT: ${{ runner.temp }}/voicescribe-previews
        run: |
          npm install --no-save --prefix "$RUNNER_TEMP/voicescribe-browser" playwright@1.56.1
          python3 -m http.server 8088 --bind 127.0.0.1 > "$RUNNER_TEMP/voicescribe-server.log" 2>&1 &
          NODE_PATH="$RUNNER_TEMP/voicescribe-browser/node_modules" node tools/preview-ui.cjs
          NODE_PATH="$RUNNER_TEMP/voicescribe-browser/node_modules" node tools/analysis-ui-test.cjs
          NODE_PATH="$RUNNER_TEMP/voicescribe-browser/node_modules" node tools/concept-map-ui-test.cjs
          NODE_PATH="$RUNNER_TEMP/voicescribe-browser/node_modules" node tools/import-ui-test.cjs
      - name: Enable KVM for native voice tests
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify native engine and update without data loss on Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_2
          disable-animations: true
          working-directory: android
          script: |
            java -classpath gradle/wrapper/gradle-wrapper.jar org.gradle.wrapper.GradleWrapperMain --no-daemon :app:connectedDebugAndroidTest
            python3 ../tools/verify-android-update.py
      - name: Prepare unsigned candidate and SDK signing tool
        run: |
          mkdir -p "$RUNNER_TEMP/voicescribe-candidate"
          cp android/app/build/outputs/apk/release/app-release-unsigned.apk "$RUNNER_TEMP/voicescribe-candidate/"
          cp "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" "$RUNNER_TEMP/voicescribe-candidate/"
      - name: Sign official APK with permanent certificate
        id: signing
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          VOICESCRIBE_KEYSTORE_B64: ${{ secrets.VOICESCRIBE_KEYSTORE_B64 }}
          VOICESCRIBE_KEYSTORE_PASSWORD: ${{ secrets.VOICESCRIBE_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$VOICESCRIBE_KEYSTORE_B64" ] || [ -z "$VOICESCRIBE_KEYSTORE_PASSWORD" ]; then
            echo '### Official APK not published: permanent signing secrets are missing.' >> "$GITHUB_STEP_SUMMARY"
            echo 'Install the private signing backup once; unsigned candidates cannot be installed.' >> "$GITHUB_STEP_SUMMARY"
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          python3 tools/sign-android-apk.py \
            --input android/app/build/outputs/apk/release/app-release-unsigned.apk \
            --apksigner "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" \
            --output "$RUNNER_TEMP/voicescribe-signed/VoiceScribe.apk"
          echo 'ready=true' >> "$GITHUB_OUTPUT"
          echo "### Official APK: permanent certificate, versionCode $VOICESCRIBE_VERSION_CODE" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload interface previews
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: VoiceScribe-interface-previews
          path: ${{ runner.temp }}/voicescribe-previews/
          if-no-files-found: ignore
          retention-days: 2
      - name: Upload unsigned candidate (not installable)
        uses: actions/upload-artifact@v4
        with:
          name: VoiceScribe-Unsigned-APK
          path: ${{ runner.temp }}/voicescribe-candidate/
          if-no-files-found: error
          retention-days: 1
      - name: Upload official signed APK
        if: steps.signing.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: VoiceScribe-Audio-APK
          path: ${{ runner.temp }}/voicescribe-signed/*.apk
          if-no-files-found: error
          retention-days: 14
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Android-test-report
          path: |
            android/app/build/reports/tests/testDebugUnitTest/
            android/app/build/reports/androidTests/connected/
            android/app/build/outputs/androidTest-results/connected/
          if-no-files-found: ignore
          retention-days: 2
