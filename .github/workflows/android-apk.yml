name: Android APK

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'android/**'
      - 'index.html'
      - 'native-bridge.js'
      - 'tools/**'
      - '.github/workflows/android-apk.yml'
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'index.html'
      - 'native-bridge.js'
      - 'icon.svg'
      - '.github/workflows/android-apk.yml'

concurrency:
  group: android-apk-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK 35
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"'
      - name: Test and build installable debug APK
        working-directory: android
        run: java -classpath gradle/wrapper/gradle-wrapper.jar org.gradle.wrapper.GradleWrapperMain --no-daemon :app:testDebugUnitTest :app:assembleDebug
      - name: Verify web and native UI flows
        run: |
          node tools/check-app.js
          node tools/smoke-test.js
          node tools/native-bridge-test.js
          node tools/provider-test.js
          node tools/speakers-test.js
          node tools/analysis-test.js
      - name: Verify responsive layout and capture previews
        env:
          CHROME_BIN: /usr/bin/google-chrome
          PREVIEW_OUTPUT: ${{ runner.temp }}/voicescribe-previews
        run: |
          npm install --no-save --prefix "$RUNNER_TEMP/voicescribe-browser" playwright@1.56.1
          python3 -m http.server 8088 --bind 127.0.0.1 > "$RUNNER_TEMP/voicescribe-server.log" 2>&1 &
          NODE_PATH="$RUNNER_TEMP/voicescribe-browser/node_modules" node tools/preview-ui.cjs
          NODE_PATH="$RUNNER_TEMP/voicescribe-browser/node_modules" node tools/analysis-ui-test.cjs
      - name: Enable KVM for native voice tests
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify packaged native voice engine on Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          target: default
          profile: pixel_2
          disable-animations: true
          working-directory: android
          script: java -classpath gradle/wrapper/gradle-wrapper.jar org.gradle.wrapper.GradleWrapperMain --no-daemon :app:connectedDebugAndroidTest
      - name: Upload interface previews
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: VoiceScribe-interface-previews
          path: ${{ runner.temp }}/voicescribe-previews/
          if-no-files-found: ignore
          retention-days: 2
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VoiceScribe-Audio-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: ${{ github.event_name == 'pull_request' && 3 || 14 }}
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Android-test-report
          path: |
            android/app/build/reports/tests/testDebugUnitTest/
            android/app/build/reports/androidTests/connected/
            android/app/build/outputs/androidTest-results/connected/
          if-no-files-found: ignore
          retention-days: 2
