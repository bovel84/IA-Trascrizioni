plugins { id 'com.android.application' }
def apkVersionCode = (System.getenv('VOICESCRIBE_VERSION_CODE') ?: '25').toInteger()
if (apkVersionCode < 25 || apkVersionCode > 2100000000) {
    throw new GradleException('VOICESCRIBE_VERSION_CODE must be between 25 and 2100000000')
}
// Only the isolated emulator fixture uses a test key. Release APKs are signed
// after all checks by tools/sign-android-apk.py, using the pinned permanent key.
def updateTestKey = System.getenv('VOICESCRIBE_TEST_KEYSTORE_FILE')
def prepareVoices = tasks.register('prepareNativeVoices', Exec) {
    workingDir rootProject.projectDir.parentFile
    commandLine 'python3', 'tools/prepare-voices.py'
    inputs.files(rootProject.file('../tools/prepare-voices.py'), rootProject.file('VOICE-NOTICES.txt'))
    inputs.dir(rootProject.file('licenses'))
    outputs.dirs(rootProject.layout.buildDirectory.dir('voice-deps'), rootProject.layout.buildDirectory.dir('voice-assets'), rootProject.layout.buildDirectory.dir('voice-test-assets'))
}
dependencies {
    implementation files(rootProject.layout.buildDirectory.file('voice-deps/sherpa.aar')).builtBy(prepareVoices)
    implementation 'org.jetbrains.kotlin:kotlin-stdlib:2.2.20'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
}
android {
    namespace 'it.voicescribe.recorder'
    compileSdk 35
    defaultConfig {
        applicationId 'it.voicescribe.pro'
        minSdk 26
        targetSdk 35
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        ndk { abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86_64' }
        versionCode apkVersionCode
        versionName '2.7.3'
    }
    signingConfigs {
        updateFixture {
            if (updateTestKey) {
                storeFile file(updateTestKey)
                storePassword System.getenv('VOICESCRIBE_TEST_KEYSTORE_PASSWORD')
                keyAlias 'voicescribe'
                keyPassword System.getenv('VOICESCRIBE_TEST_KEYSTORE_PASSWORD')
                storeType 'PKCS12'
            }
        }
    }
    buildTypes {
        release {
            debuggable false
            minifyEnabled false
        }
        upgradeTest {
            initWith debug
            applicationIdSuffix '.updatetest'
            matchingFallbacks = ['debug']
            signingConfig updateTestKey ? signingConfigs.updateFixture : signingConfigs.debug
        }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_1_8; targetCompatibility JavaVersion.VERSION_1_8 }
}
def webAssets = layout.buildDirectory.dir('generated/voicescribeAssets')
tasks.register('syncVoiceScribeAssets', Copy) {
    from(rootProject.projectDir.parentFile) {
        include 'index.html', 'native-bridge.js', 'concept-map.js', 'appearance.js', 'audio-import.js', 'icon.svg', 'manifest.webmanifest'
    }
    into(webAssets)
    filesMatching('index.html') {
        filter { line -> line.replace('https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js', 'vendor/jspdf.umd.min.js').replace('https://cdn.jsdelivr.net/npm/chart.js@4.4.2/dist/chart.umd.min.js', 'vendor/chart.umd.js') }
    }
}
android.sourceSets.main.assets.srcDir(webAssets)
tasks.named('preBuild').configure { dependsOn('syncVoiceScribeAssets') }

android.sourceSets.main.assets.srcDir(rootProject.layout.buildDirectory.dir('voice-assets'))
android.sourceSets.androidTest.assets.srcDir(rootProject.layout.buildDirectory.dir('voice-test-assets'))
tasks.named('preBuild').configure { dependsOn(prepareVoices) }
